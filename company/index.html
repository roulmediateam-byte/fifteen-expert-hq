<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Company view</title>
  <link rel="icon" href="data:,">
  <link rel="preload" href="assets/site-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/site-serif-semibold-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="app.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to the content</a>
  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <strong id="company" class="brand-name">Company view</strong>
        <span id="company-sub" class="brand-sub">Read-only</span>
      </div>
      <div class="top-actions">
        <span id="run-state" class="run-state" role="status"></span>
        <a class="lock" href="/lock" title="Sign this browser out">Lock</a>
      </div>
    </div>
    <nav class="tabs" aria-label="Company view sections">
      <div class="tabs-inner" role="tablist">
        <button role="tab" type="button" id="tab-org" aria-controls="panel-org" data-tab="org">Org chart</button>
        <button role="tab" type="button" id="tab-feed" aria-controls="panel-feed" data-tab="feed">Feed</button>
        <button role="tab" type="button" id="tab-heatmap" aria-controls="panel-heatmap" data-tab="heatmap">Heatmap</button>
        <button role="tab" type="button" id="tab-help" aria-controls="panel-help" data-tab="help">Help</button>
      </div>
    </nav>
  </header>

  <div id="banner" class="banner" role="status" hidden></div>

  <main id="main" tabindex="-1">
    <section id="numbers" class="numbers" aria-label="The company now"></section>
    <section id="panel-org" class="panel" role="tabpanel" aria-labelledby="tab-org" hidden></section>
    <section id="panel-feed" class="panel" role="tabpanel" aria-labelledby="tab-feed" hidden></section>
    <section id="panel-heatmap" class="panel" role="tabpanel" aria-labelledby="tab-heatmap" hidden></section>
    <section id="panel-help" class="panel" role="tabpanel" aria-labelledby="tab-help" hidden></section>
    <noscript><p class="panel">The Company view needs JavaScript switched on.</p></noscript>
  </main>

  <footer class="foot">
    <p class="foot-main"><strong>No patient data.</strong> Shared view: treat everything here as public.</p>
    <p id="foot-meta" class="foot-meta">Read-only: nothing on this page changes GitHub or Claude.</p>
  </footer>
</body>
</html>
